[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "crypto-trader"
version = "4.0.0"
description = "Production-grade crypto futures trading system for the Indian market"
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "requests>=2.28.0",
    "websocket-client>=1.6.0",
    "python-telegram-bot>=20.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.26,<0.28",
]

[tool.setuptools.packages.find]
include = ["crypto_trader*"]

[tool.setuptools.package-data]
crypto_trader = ["ai/prompts/*.txt", "requirements.txt"]
